<!DOCTYPE html>
<title>Éphéméride</title>
<style>
	canvas { width: 100%; background: lightcyan }
</style>

<input type="date" onchange="miriade(stars[0])"/>
<canvas></canvas>

<script>
stars = ["p:Soleil", "s:Moon"]
data  = { }

onload = function(){
	document.querySelector('input[type="date"]').valueAsDate = new Date()
	miriade(stars[0])
}
onresize = function() {
	draw()
}
miriade = function(star){
	date = document.querySelector('input[type="date"]').value
	url = "https://vo.imcce.fr/webservices/miriade/ephemcc_query.php?-nbd=25&-step=1h&-mime=text&-observer=4.4990169+44.0932903+282.26&-tcoor=3"
	url += "&-ep="+date
	url += "&-name="+star
	http = new XMLHttpRequest()
	http.open("GET", url)
	http.onload = function(){
		read(http.response, star)
	}
	http.send()
}
read = function(response, star){
	data[star] = []
	for(line of response.split(/\r?\n/)){
		if(line=="" || line[0]=="#") continue
		x = Number(line.substring(40,43))
		if(x<0)
			x -= Number(line.substring(44,46)/60)
		else
			x += Number(line.substring(44,46)/60)
		//x = Math.tan(x/180*Math.PI)
		data[star].push(x)
	}
	i = stars.indexOf(star)+1
	if(stars[i])
		miriade(stars[i])
	else
		draw()
}
draw = function(){
	g = document.querySelector("canvas")
	g.width  = width  = g.offsetWidth
	g.height = height = g.width /4
	g = g.getContext("2d")
	g.font = "18px calibri"
	g.textAlign = "center"
	g.textBaseline = "top"
	g.textBaseline = "middle"
	
	g.beginPath()
	g.moveTo(0,height-20)
	g.lineTo(width, height-20)
	g.stroke()
	
	symbol = "☼"
	for(star of Object.keys(data)){
		start = true
		
		g.beginPath()
		g.strokeStyle = "lightgrey"
		for(i=0; i<25; i++)
			if(data[star][i]>=-10){
				t = width*i/24
				x = height - data[star][i] * height/90 - 40 
				x = height - data[star][i] * height/90 - 40 
				if(start){
					g.moveTo(t, x)
					start = false
				}
				g.lineTo(t, x)
			}
		g.stroke()
		
		symbol =(star=="p:Soleil") ? "🌞" : "☾"
		for(i=0; i<25; i++)
			if(data[star][i]>=-10){
				t = width*i/24
				x = height - data[star][i] * height/90 - 40 
				g.fillText(symbol, t, x)
				g.fillText((i+2)%24, t, height-10)
			}
	}
	g.stroke()
	//g.fill()
}
</script>
